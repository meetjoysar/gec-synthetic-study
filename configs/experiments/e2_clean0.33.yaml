# Generated by scripts/make_configs.py - edit that, not this file.
name: e2_clean0.33
family: e2
condition: synthetic
description: >
  Clean:noisy balance (spec E2) at the best p from E1, clean_ratio=0.33.
  Tests whether identity pairs reduce over-correction (Koo et al.).
  0.33 is close to W&I's own share of already-correct sentences, which we
  measured at 33.8% of train_real.
dataset:
  synthetic:
    enabled: true
    p: ${select.e1_best_p}
    clean_ratio: 0.33
  real:
    enabled: false
eval:
  splits: [val, test]
# true because e3_synthetic aliases the best E2 run, and both
# e3_synth2real's warm start and the Gradio demo load those weights.
keep_checkpoint: true
