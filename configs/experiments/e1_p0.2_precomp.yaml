name: e1_p0.2_precomp
family: e1
condition: synthetic
description: >
  EXTRA E1 arm (deviation D10, user-requested): identical to e1_p0.2 in every
  respect except the generator weights, which are pre-compensated for
  applicability gating so the REALISED error mix is roughly uniform across the
  10 covered ERRANT categories rather than merely the requested weights being
  uniform. Measured total variation distance against uniform falls 0.336 ->
