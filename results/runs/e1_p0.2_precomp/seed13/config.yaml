description: 'EXTRA E1 arm (deviation D10, user-requested): identical to e1_p0.2 in
  every respect except the generator weights, which are pre-compensated for applicability
  gating so the REALISED error mix is roughly uniform across the 10 covered ERRANT
  categories rather than merely the requested weights being uniform. Measured total
  variation distance against uniform falls 0.336 -> 0.163 over 3 clipped iterations.

  Same p, same seed and the same base-set sentences as e1_p0.2, so the pair is a controlled
  comparison in which only the error-type mix differs. This separates "is there a
  best noise level?" from "does the generator''s skewed realised distribution hold
  synthetic-only back?".

  '
device: auto
epochs: 3
eval:
  limit: null
  selection_metric: val.f05
  splits:
  - val
  - test
eval_batch_size: 32
family: e1
generation:
  max_new_tokens: 128
  num_beams: 4
generator:
  weights:
    case: 0.03
    det_delete: 0.06
    det_insert: 0.05
    det_swap: 0.05
    noun_num: 0.1
    prep_delete: 0.07
    prep_swap: 0.09
    punct_delete: 0.06
    punct_insert: 0.04
    spell: 0.08
    sva: 0.1
    verb_form: 0.08
    verb_tense: 0.1
    word_delete: 0.05
    word_dup: 0.04
gradient_accumulation_steps: 2
group_by_length: true
keep_checkpoint: false
learning_rate: 0.0003
max_source_len: 128
max_steps: null
max_target_len: 128
model_name: t5-small
name: e1_p0.2_precomp
precision: auto
predict_max_source_len: 192
prefix: 'grammar: '
